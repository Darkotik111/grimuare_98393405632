<html lang="ru">
<head>

<title>Гримуар повелительниц подземелья</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&display=swap');

  :root {
    --bg: #0a080b; --bg-texture: radial-gradient(circle at 50% 0%, #1a141c 0%, #0a080b 70%);
    --card: #141116; --card2: #1c161d; --text: #e2d5c4; --muted: #8a7f75;
    --accent: #d4af37; --accent-hover: #ffd700; --danger: #a73a3a; --ok: #4a9c6c;
    --border: #3a2e28; --warn: #c97b2a;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: var(--font-sans); background: var(--bg-texture); color: var(--text); min-height: 100vh; padding: 16px; padding-bottom: 90px; background-attachment: fixed; }
  
  #authScreen { position: fixed; inset: 0; background: var(--bg-texture); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-box { background: var(--card); border: 1px solid var(--accent); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 0 40px rgba(212,175,55,0.15); }
  .auth-box h2 { font-family: var(--font-serif); color: var(--accent); font-size: 24px; margin-top: 0; margin-bottom: 20px; }
  .auth-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--card2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-family: var(--font-sans); }
  .auth-box input:focus { outline: none; border-color: var(--accent); }
  .auth-box button { width: 100%; padding: 12px; margin-bottom: 10px; }
  .auth-error { color: var(--danger); font-size: 13px; margin-bottom: 10px; display: none; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  h1 { font-family: var(--font-serif); font-size: 24px; margin: 0; font-weight: 700; color: var(--accent); text-shadow: 0 0 10px rgba(212, 175, 55, 0.3); letter-spacing: 1px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  button { background: transparent; color: var(--text); border: 1px solid var(--border); padding: 8px 14px; border-radius: 4px; font-size: 14px; cursor: pointer; transition: .2s; font-weight: 600; font-family: var(--font-serif); letter-spacing: 0.5px; }
  button:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 8px rgba(212,175,55,0.2); }
  button.primary { background: rgba(212, 175, 55, 0.1); border-color: var(--accent); color: var(--accent); }
  button.primary:hover { background: rgba(212, 175, 55, 0.2); }
  button.warn { border-color: #5c3a1e; color: #e8a862; background: rgba(92, 58, 30, 0.2); }
  button.warn:hover { border-color: var(--warn); color: #ffc285; box-shadow: 0 0 8px rgba(201,123,42,0.2); }
  button.danger { border-color: #5c1e1e; color: #e86262; background: rgba(92, 30, 30, 0.2); }
  button.danger:hover { border-color: var(--danger); color: #ff8585; box-shadow: 0 0 8px rgba(167,58,58,0.2); }
  
  .edit-btn { padding: 2px 6px; font-size: 12px; background: transparent; border: 1px solid transparent; color: var(--muted); cursor: pointer; border-radius: 4px; margin-left: 6px;}
  .edit-btn:hover { color: var(--accent); border-color: var(--border); background: rgba(212,175,55,0.1);}
  .formula-edit-btn { float: right; background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.3); color: var(--accent); font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: pointer;}
  .formula-edit-btn:hover { background: rgba(212,175,55,0.2); }

  .search-bar { width: 100%; padding: 12px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px; margin-bottom: 20px; font-family: var(--font-serif); transition: 0.3s; }
  .search-bar:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px rgba(212,175,55,0.1); }

  .breadcrumbs { font-size: 14px; color: var(--muted); margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; font-family: var(--font-serif);}
  .breadcrumbs a { color: var(--accent); text-decoration: none; cursor: pointer; transition: .2s; }
  .breadcrumbs a:hover { color: var(--accent-hover); text-shadow: 0 0 8px rgba(255,215,0,0.4); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }

  .palette-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; transition: .2s; display: flex; justify-content: space-between; align-items: center; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); }
  .palette-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 4px 12px rgba(212,175,55,0.1); }
  .palette-card.special { border-color: rgba(212, 175, 55, 0.6); background: rgba(212, 175, 55, 0.05); }
  .palette-info .title { font-family: var(--font-serif); font-weight: 700; font-size: 18px; margin-bottom: 6px; line-height: 1.3; color: #f0e6d2; }
  .palette-info .meta { font-size: 13px; color: var(--muted); margin-top: 6px; font-style: italic; }

  .color-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.5); content-visibility: auto; contain-intrinsic-size: 200px; }
  .color-card.clickable { cursor: pointer; transition: 0.2s; }
  .color-card.clickable:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 4px 12px rgba(212,175,55,0.1); }
  
  .card-head { display: flex; gap: 12px; align-items: center; }
  .swatch { width: 42px; height: 42px; border-radius: 50%; border: 2px solid rgba(212, 175, 55, 0.4); flex-shrink: 0; box-shadow: inset 0 0 10px rgba(255,255,255,0.2), 0 0 12px rgba(0,0,0,0.8); position: relative; }
  .swatch::after { content: ''; position: absolute; top: 4px; left: 6px; width: 12px; height: 6px; background: rgba(255,255,255,0.4); border-radius: 50%; transform: rotate(-45deg); }
  
  .names { flex: 1; min-width: 0; }
  .names .title { font-family: var(--font-serif); font-weight: 700; font-size: 16px; line-height: 1.3; color: #f0e6d2;}
  .names .sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--font-serif); font-style: italic; }
  
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-top: 6px; margin-right: 4px; font-weight: bold; font-family: var(--font-sans); }

  .tag.old { background: rgba(167, 58, 58, 0.1); color: #e07a7a; border: 1px solid rgba(167, 58, 58, 0.3); }
  .tag.ncs { background: rgba(79, 140, 255, 0.15); color: #9bc1ff; border: 1px solid rgba(79, 140, 255, 0.3); }
  
  .formula-box { background: var(--card2); padding: 10px; border-radius: 6px; font-size: 13px; font-family: ui-monospace, monospace; border-left: 3px solid var(--border); }
  .formula-box.old-formula { border-left-color: var(--danger); opacity: 0.7; }
  .formula-title { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; font-weight: bold; font-family: var(--font-sans); letter-spacing: 0.5px; }
  
  .vol-calc { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .vol-calc input { width: 60px; padding: 4px 6px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-family: ui-monospace, monospace; text-align: center; }
  .vol-calc input:focus { outline: none; border-color: var(--accent); }

  .similar-box { background: rgba(212, 175, 55, 0.05); border: 1px solid rgba(212, 175, 55, 0.2); padding: 10px; border-radius: 6px; margin-top: 6px; }
  .similar-title { font-family: var(--font-serif); font-size: 13px; color: var(--accent); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.5px;}
  .similar-item { font-size: 12px; display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(212,175,55,0.2); padding: 6px 4px; cursor: pointer; border-radius: 4px; transition: 0.15s;}
  .similar-item:hover { background: rgba(212,175,55,0.1); border-bottom-color: transparent; }
  .similar-item:last-child { border-bottom: none; }
  .match-percent { color: var(--ok); font-weight: bold; font-family: ui-monospace, monospace;}

  .card-actions { display: flex; gap: 8px; margin-top: 8px; }
  .card-actions button { flex: 1; padding: 8px; font-size: 13px; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 16px; font-family: var(--font-serif); font-style: italic;}
  .load-more { display: block; width: 100%; margin-top: 20px; padding: 14px; background: rgba(212, 175, 55, 0.1); border: 1px solid var(--accent); color: var(--accent); font-family: var(--font-serif); font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
  .load-more:hover { background: rgba(212, 175, 55, 0.2); box-shadow: 0 0 15px rgba(212,175,55,0.3);}

  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
  .modal-overlay.active { display: flex; }
  .modal-content { background: var(--card); border: 1px solid var(--accent); border-radius: 12px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 0 0 30px rgba(212,175,55,0.2); position: relative; animation: modalIn 0.2s ease-out; }
  @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal-close { position: absolute; top: 12px; right: 12px; background: transparent; border: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 0; line-height: 1; }
  .modal-close:hover { color: var(--danger); }

  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: #1a141c; color: var(--accent); border: 1px solid var(--accent); padding: 12px 24px; border-radius: 6px; font-weight: 600; font-family: var(--font-serif); transition: .3s; z-index: 300; max-width: 90vw; text-align: center; box-shadow: 0 0 20px rgba(212,175,55,0.2); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.err { border-color: var(--danger); color: #e07a7a; box-shadow: 0 0 20px rgba(167,58,58,0.2); }

  @media (max-width: 600px) { body { padding: 12px; padding-bottom: 80px; } h1 { font-size: 20px; } .grid { grid-template-columns: 1fr; } .toolbar button { padding: 6px 10px; font-size: 12px; } .modal-content { padding: 16px; } .vol-calc { flex-direction: column; align-items: flex-start; gap: 4px; } }
</style>
</head>
<body>

<!-- Экран входа -->
<div id="authScreen">
  <div class="auth-box">
    <h2>🔒 Вход в Гримуар</h2>
    <div class="auth-error" id="authError"></div>
    <input type="email" id="authEmail" placeholder="Email (рабочая почта)">
    <input type="password" id="authPass" placeholder="Пароль">
    <button class="primary" onclick="login()">Войти</button>
    <button onclick="register()" style="background:transparent; border:none; color:var(--muted); font-size:13px; text-decoration:underline;">Зарегистрировать нового коллегу</button>
  </div>
</div>

<!-- Основной интерфейс -->
<div id="appScreen" style="display:none;">
  <header>
    <h1 id="pageTitle">📜 Гримуар повелительниц подземелья</h1>
    <div class="toolbar" id="toolbar">
      <button onclick="document.getElementById('importFiles').click()" class="primary">📥 Влить данные</button>
      <button onclick="toggleArchiveView()" id="archiveBtn">🗄 Забвение</button>
      <button onclick="toggleEditMode()" id="editModeBtn">✍️ Редактировать</button>
      <button onclick="logout()" class="danger">🚪 Выйти</button>
    </div>
  </header>
  <input type="file" id="importFiles" multiple accept=".csv" style="display:none" onchange="handleImport(event)">

  <div class="breadcrumbs" id="crumbs" style="display:none"></div>
  <input class="search-bar" id="search" placeholder="🔍 Поиск по всему гримуару..." oninput="onSearchInput()">

  <div class="grid" id="list"></div>
  <div class="empty" id="empty" style="display:none"></div>
  <button class="load-more" id="loadMoreBtn" style="display:none" onclick="loadMore()">📜 Показать еще свитки</button>

  <div class="modal-overlay" id="colorModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ==========================================
// 1. НАСТРОЙКИ SUPABASE
// ==========================================
const SUPABASE_URL = 'https://hdsfocdvtgfzagqvgrtv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhkc2ZvY2R2dGdmemFncXZncnR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNzE3NDQsImV4cCI6MjEwNzg0Nzc0NH0._DmYReNHr6D-qB1GfjSJ9A55SAtbVyXnOSZim13nWSs';

const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

// ============ Утилиты ============
const $=id=>document.getElementById(id);
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,err){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(err?' err':'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',4000); }

// ============ АВТОРИЗАЦИЯ ============
async function login() {
  const email = $('authEmail').value;
  const pass = $('authPass').value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
  
  if (error) {
    $('authError').textContent = 'Ошибка: ' + error.message;
    $('authError').style.display = 'block';
  } else {
    checkAuth();
  }
}

async function register() {
  const email = $('authEmail').value;
  const pass = $('authPass').value;
  if (!email || !pass) { alert('Введите email и пароль'); return; }
  
  const { error } = await supabaseClient.auth.signUp({ email, password: pass });
  if (error) {
    $('authError').textContent = 'Ошибка: ' + error.message;
    $('authError').style.display = 'block';
  } else {
    alert('Регистрация успешна! Теперь вы можете войти.');
  }
}

async function logout() {
  await supabaseClient.auth.signOut();
  location.reload();
}

async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    $('authScreen').style.display = 'none';
    $('appScreen').style.display = 'block';
    await loadDataFromCloud();
  } else {
    $('authScreen').style.display = 'flex';
    $('appScreen').style.display = 'none';
  }
}

// ============ СИНХРОНИЗАЦИЯ С БАЗОЙ ============
async function loadDataFromCloud() {
  const { data, error } = await supabaseClient.from('palettes').select('data');
  if (error) { toast('Ошибка загрузки: ' + error.message, true); return; }
  
  allPalettes = data.map(row => row.data);
  allPalettes.sort((a,b)=>{
    if (a.isVirtual && !b.isVirtual) return -1;
    if (!a.isVirtual && b.isVirtual) return 1;
    return a.name.localeCompare(b.name);
  });
  render();
}

async function savePaletteToCloud(palette) {
  const { error } = await supabaseClient.from('palettes').upsert({ id: palette.id, name: palette.name, data: palette });
  if (error) { toast('Ошибка сохранения: ' + error.message, true); console.error(error); }
}

async function clearCloudBase() {
  const { error } = await supabaseClient.from('palettes').delete().neq('id', 0);
  if (error) { toast('Ошибка очистки: ' + error.message, true); }
}

// ============ ОСТАЛЬНАЯ ЛОГИКА ============
function parseColorName(c) {
  let main = c.EXTERNAL_NAME || c.NAME || 'Без названия';
  let sub = c.NAME_RUS || c.NAME || '';
  const hasRussian = /[А-Яа-яЁё]/.test(main);
  if (!hasRussian) {
    const rusAlt = c.NAME_RUS || c.NAME;
    if (rusAlt && /[А-Яа-яЁё]/.test(rusAlt)) { main = rusAlt; sub = c.EXTERNAL_NAME || c.NAME; }
  }
  return { main, sub };
}

function filterAndSort(items, query, getNameFn) {
  if (!query) return items;
  const q = query.toLowerCase();
  if (q.length === 1) return items.filter(item => getNameFn(item).toLowerCase().includes(q));
  const matched = [];
  for (const item of items) {
    const nameStr = getNameFn(item).toLowerCase();
    const index = nameStr.indexOf(q);
    if (index !== -1) { matched.push({ item, priority: index === 0 ? 1 : 2, index }); }
  }
  matched.sort((a, b) => { if (a.priority !== b.priority) return a.priority - b.priority; return a.index - b.index; });
  return matched.map(m => m.item);
}

function shouldFindSimilar(materialName) {
  if (!materialName) return false;
  const m = materialName.toLowerCase();
  return m.includes('декор') || m.includes('высокопроч') || m.includes('интерьер');
}

function parseCSV(text) {
  const result = []; let row = []; let inQuotes = false; let val = '';
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i+1] === '"') { val += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { val += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',' || c === ';') { row.push(val); val = ''; }
      else if (c === '\n' || c === '\r') { 
        if (c === '\r' && text[i+1] === '\n') i++;
        row.push(val); if (row.length > 1 || row[0] !== '') result.push(row); row = []; val = ''; 
      } else { val += c; }
    }
  }
  if (val || row.length) { row.push(val); result.push(row); }
  return result;
}

async function handleImport(e) {
  const files = e.target.files;
  if (!files.length) return;

  let dataColor = [], dataFormula = [], dataFormulaOld = [], dataComponent = [], dataComponentOld = [], dataPalette = [], dataPigment = [], dataMaterial = [];

  for (let file of files) {
    const name = file.name.toLowerCase();
    const text = await file.text();
    const rows = parseCSV(text);
    if (rows.length < 2) continue;
    const headers = rows[0].map(h => h.trim().replace(/^["']|["']$/g, '').toUpperCase());
    const records = rows.slice(1).map(r => {
      let obj = {}; headers.forEach((h, i) => obj[h] = r[i] ? r[i].trim().replace(/^["']|["']$/g, '') : ''); return obj;
    });

    if (name.includes('color') && !name.includes('component')) dataColor = records;
    else if (name.includes('formula_component_old')) dataComponentOld = records;
    else if (name.includes('formula_component')) dataComponent = records;
    else if (name.includes('formula_old')) dataFormulaOld = records;
    else if (name.includes('formula')) dataFormula = records;
    else if (name.includes('palette')) dataPalette = records;
    else if (name.includes('pigment') || name.includes('tint') || name.includes('base')) dataPigment = records;
    else if (name.includes('material')) dataMaterial = records;
  }

  if (!dataColor.length || (!dataFormula.length && !dataFormulaOld.length)) { toast('Ошибка: нет файлов color или formula', true); return; }
  $('pageTitle').textContent = '⏳ Переписываем свитки...';

  const palettesObj = {};
  dataPalette.forEach(p => { 
    // Ищем ID палитры в разных возможных колонках
    const pId = p.ID_PALETTE || p.ID || p.id_palette || p.id;
    palettesObj[pId] = { id: Number(pId), name: p.NAME_PALETTE || p.NAME || p.name_palette || p.name || 'Без названия', colors: [] }; 
  });
  
  const pigmentsMap = {}; dataPigment.forEach(p => pigmentsMap[p.ID] = p.CODE);
  const materialsMap = {}; dataMaterial.forEach(m => materialsMap[m.ID] = m.SHORT_NAME || m.NAME);
  const colorsMap = {}; dataColor.forEach(c => colorsMap[c.ID] = { ...c, formulas: [] });

  function buildFormulas(formulasData, componentsData, isOld) {
    const fMap = {};
    formulasData.forEach(f => { fMap[f.ID] = { ...f, components: [], isOld }; });
    componentsData.forEach(comp => {
      if (fMap[comp.FORMULA_ID]) {
        const amt = parseFloat((comp.AM_DEC || comp.AMOUNT || '0').replace(',', '.'));
        if (amt > 0 && comp.PIGMENT_ID && comp.PIGMENT_ID !== 'NULL') {
          fMap[comp.FORMULA_ID].components.push({ pigment: pigmentsMap[comp.PIGMENT_ID] || comp.PIGMENT_ID, amount: amt });
        }
      }
    });
    Object.values(fMap).forEach(f => {
      if (colorsMap[f.COLOR_ID] && f.components.length > 0) {
        colorsMap[f.COLOR_ID].formulas.push({
          components: f.components, base: f.MATERIAL_BASE, name: f.FORMULA_NAME,
          materialId: f.MATERIAL_ID, materialName: materialsMap[f.MATERIAL_ID] || '', isOld: isOld
        });
      }
    });
  }

  if (dataFormula.length > 0) buildFormulas(dataFormula, dataComponent, false);
  if (dataFormulaOld.length > 0) buildFormulas(dataFormulaOld, dataComponentOld, true);

  const virtualNCS = { id: 'virtual_ncs', name: '🔮 Справочник NCS', colors: [], isVirtual: true };
  const virtualRAL = { id: 'virtual_ral', name: '🔮 Справочник RAL', colors: [], isVirtual: true };

  Object.values(colorsMap).forEach(c => {
    if (c.formulas.length === 0) return;
    
    // Ищем ID палитры цвета
    const pId = c.PALETTE_ID || c.palette_id || c.ID_PALETTE;
    
    if (!palettesObj[pId]) {
      palettesObj[pId] = { id: Number(pId), name: 'Раздел ' + pId, colors: [] };
    }
    
    let hex = '#000000';
    if (c.RGB && c.RGB !== 'NULL' && c.RGB !== '0') { const rgbInt = parseInt(c.RGB); if (!isNaN(rgbInt)) hex = '#' + (rgbInt & 0xFFFFFF).toString(16).padStart(6, '0'); }
    c.formulas.sort((a, b) => a.isOld - b.isOld);
    c.isArchived = false;
    const colorData = { ...c, hex };
    
    palettesObj[pId].colors.push(colorData);
    
    // УМНЫЙ ПОИСК NCS (ищем NCS в любом из трех названий)
    const searchString = ((c.EXTERNAL_NAME||'') + ' ' + (c.NAME||'') + ' ' + (c.NAME_RUS||'')).toUpperCase();
    if (searchString.includes('NCS')) virtualNCS.colors.push({ ...colorData, isVirtualCopy: true });
    if (searchString.includes('RAL')) virtualRAL.colors.push({ ...colorData, isVirtualCopy: true });
  });

  await clearCloudBase();
  
  // Сохраняем виртуальные папки первыми, чтобы они были в начале списка
  if (virtualNCS.colors.length > 0) { 
    virtualNCS.colors.sort((a,b) => (a.EXTERNAL_NAME||'').localeCompare(b.EXTERNAL_NAME||'')); 
    await savePaletteToCloud(virtualNCS); 
  }
  if (virtualRAL.colors.length > 0) { 
    virtualRAL.colors.sort((a,b) => (a.EXTERNAL_NAME||'').localeCompare(b.EXTERNAL_NAME||'')); 
    await savePaletteToCloud(virtualRAL); 
  }
  
  for (let key in palettesObj) {
    const p = palettesObj[key];
    if (p.colors.length > 0) { 
      p.colors.sort((a,b) => (a.EXTERNAL_NAME||'').localeCompare(b.EXTERNAL_NAME||'')); 
      await savePaletteToCloud(p); 
    }
  }

  toast(`Успех! Данные загружены в облако.`);
  await loadDataFromCloud();
  e.target.value = '';
}

let allPalettes=[]; let currentPaletteId=null; let isArchiveView = false; let isEditMode = false;
let currentItems = []; let visibleCount = 50; const PAGE_SIZE = 50;

function toggleArchiveView() { isArchiveView = !isArchiveView; $('archiveBtn').classList.toggle('primary', isArchiveView); currentPaletteId = null; $('search').value = ''; render(); }

function toggleEditMode() {
  if (isEditMode) { isEditMode = false; $('editModeBtn').classList.remove('primary'); toast('Режим чтения.'); render(); return; }
  const pass = prompt('Введите пароль (1234):');
  if (pass === '1234') { isEditMode = true; $('editModeBtn').classList.add('primary'); toast('Режим редактора.'); render(); }
  else if (pass !== null) toast('Неверный пароль.', true);
}

let searchTimeout;
function onSearchInput() { clearTimeout(searchTimeout); searchTimeout = setTimeout(() => { visibleCount = PAGE_SIZE; render(); }, 300); }
function loadMore() { visibleCount += PAGE_SIZE; renderListOnly(); }

async function render(){
  if (allPalettes.length === 0) await loadDataFromCloud();
  const globalQuery = $('search').value.trim().toLowerCase();
  if (!currentPaletteId && globalQuery.length >= 2) { renderGlobalSearch(); return; }
  if(!currentPaletteId){ renderPalettes(); } else { renderColors(); }
}

function renderListOnly() { if(!currentPaletteId){ renderPalettes(); } else { renderColors(); } }

function renderGlobalSearch() {
  const q = $('search').value.trim().toLowerCase();
  $('pageTitle').textContent = `🔍 Результаты поиска: "${q}"`;
  $('crumbs').style.display='flex'; $('crumbs').innerHTML=`<a onclick="clearSearch()">← Сбросить поиск</a>`;
  const allColors = [];
  allPalettes.forEach(p => {
    if (p.isVirtual) return;
    p.colors.forEach(c => { if (c.isArchived === isArchiveView) { const nd = parseColorName(c); allColors.push({ ...c, sourcePaletteName: p.name, searchText: nd.main + ' ' + nd.sub }); } });
  });
  currentItems = filterAndSort(allColors, q, c => c.searchText);
  $('empty').style.display=currentItems.length?'none':'block';
  const list=$('list'); list.innerHTML='';
  const itemsToShow = currentItems.slice(0, visibleCount);
  for(const c of itemsToShow){
    const el=document.createElement('div'); el.className='color-card clickable';
    el.onclick=(e) => { if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') openColorModal(c.ID); };
    let formulasHtml = '';
    const mainFormula = c.formulas.find(f => !f.isOld) || c.formulas[0];
    if (mainFormula) {
      const comps = mainFormula.components.map(x => `<b>${x.pigment}</b>:${x.amount.toFixed(2)}`).join(' ');
      const matTag = mainFormula.materialName ? `<span class="tag material">${escapeHtml(mainFormula.materialName)}</span>` : '';
      formulasHtml = `<div class="formula-box"><div class="formula-title">База ${mainFormula.base || '?'} ${matTag}</div><div>${comps} <span style="font-size:11px;color:var(--muted)">oz</span></div></div>`;
    }
    let ncsBadge = ''; const searchStr = ((c.EXTERNAL_NAME||'') + ' ' + (c.NAME||'')).toUpperCase(); if (searchStr.includes('NCS')) ncsBadge = `<span class="tag ncs">NCS</span>`;
    const nameData = parseColorName(c);
    el.innerHTML=`
      <div class="card-head"><div class="swatch" style="background:${c.hex}"></div>
        <div class="names"><div class="title">${escapeHtml(nameData.main)} ${ncsBadge}</div>
          <div class="sub">${escapeHtml(nameData.sub)}</div>
          <div style="font-size: 11px; color: var(--accent); margin-top: 4px;">📁 ${escapeHtml(c.sourcePaletteName)}</div>
        </div></div>${formulasHtml}`;
    list.appendChild(el);
  }
  updateLoadMoreBtn(itemsToShow.length, currentItems.length);
}

function clearSearch() { $('search').value = ''; currentPaletteId = null; visibleCount = PAGE_SIZE; render(); }

function renderPalettes(){
  const q=$('search').value.trim().toLowerCase();
  const totalRecipes = allPalettes.reduce((sum, p) => sum + p.colors.filter(c => !c.isArchived).length, 0);
  $('pageTitle').textContent = isArchiveView ? '🗄 Забвение' : `📜 Гримуар (${totalRecipes} рецептов)`;
  $('crumbs').style.display='none';
  const processedPalettes = allPalettes.map(p => {
    const activeColors = p.colors.filter(c => !c.isArchived); const archivedColors = p.colors.filter(c => c.isArchived);
    return { ...p, activeCount: activeColors.length, archivedCount: archivedColors.length };
  });
  currentItems = filterAndSort(processedPalettes, q, p => p.name);
  $('empty').style.display=currentItems.length?'none':'block';
  $('empty').textContent=allPalettes.length?'Ничего не найдено':'База пуста. Загрузите CSV.';
  const list=$('list'); list.innerHTML='';
  const itemsToShow = currentItems.slice(0, visibleCount);
  for(const p of itemsToShow){
    if (isArchiveView && p.isVirtual) continue;
    const el=document.createElement('div'); el.className='palette-card' + (p.isVirtual ? ' special' : '');
    const count = isArchiveView ? p.archivedCount : p.activeCount; if (count === 0) el.style.opacity = '0.5';
    el.onclick=(e)=>{ if (e.target.tagName === 'BUTTON') return; currentPaletteId=p.id; $('search').value=''; visibleCount = PAGE_SIZE; render(); };
    let renameBtn = ''; if (isEditMode && !p.isVirtual) renameBtn = `<button class="edit-btn" onclick="renamePalette('${p.id}')">✏️</button>`;
    el.innerHTML=`<div class="palette-info"><div class="title">${escapeHtml(p.name)} ${renameBtn}</div><div class="meta">${count} ${isArchiveView ? 'в забвении' : 'рецептов'}</div></div>`;
    list.appendChild(el);
  }
  updateLoadMoreBtn(itemsToShow.length, currentItems.length);
}

function renderColors(){
  const p=allPalettes.find(x=>String(x.id)===String(currentPaletteId));
  if(!p){ currentPaletteId=null; render(); return; }
  const q=$('search').value.trim().toLowerCase();
  $('pageTitle').textContent = (isArchiveView ? '🗄 ' : '📜 ') + escapeHtml(p.name);
  $('crumbs').style.display='flex'; $('crumbs').innerHTML=`<a onclick="backToPalettes()">← В главное меню</a>`;
  let colors = p.colors.filter(c => !!c.isArchived === isArchiveView);
  currentItems = filterAndSort(colors, q, c => { const nd = parseColorName(c); return nd.main + ' ' + nd.sub; });
  $('empty').style.display=currentItems.length?'none':'block';
  const list=$('list'); list.innerHTML='';
  const itemsToShow = currentItems.slice(0, visibleCount);
  const allActiveColorsCache = allPalettes.flatMap(pal => pal.isVirtual ? [] : pal.colors.filter(c => !c.isArchived));

  function findSimilar(targetFormula, targetMaterialId) {
    if (!targetFormula || !targetFormula.components || !shouldFindSimilar(targetFormula.materialName)) return [];
    const targetMap = {}; targetFormula.components.forEach(c => targetMap[c.pigment] = c.amount);
    const results = [];
    for (const other of allActiveColorsCache) {
      if (other.ID === targetFormula.COLOR_ID) continue; 
      for (const f of other.formulas) {
        if (f.isOld || f.materialId !== targetMaterialId || !shouldFindSimilar(f.materialName)) continue;
        const otherMap = {}; f.components.forEach(c => otherMap[c.pigment] = c.amount);
        let diff = 0; const allPigments = new Set([...Object.keys(targetMap), ...Object.keys(otherMap)]);
        for (let pId of allPigments) { diff += Math.abs((targetMap[pId] || 0) - (otherMap[pId] || 0)); }
        results.push({ color: other, diff });
      }
    }
    results.sort((a,b) => a.diff - b.diff); return results.slice(0, 3);
  }

  for(const c of itemsToShow){
    const el=document.createElement('div'); el.className='color-card clickable';
    el.onclick=(e) => { if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT') openColorModal(c.ID); };
    let formulasHtml = '';
    c.formulas.forEach((f, fIndex) => {
      const comps = f.components.map(x => `<b>${x.pigment}</b>:${x.amount.toFixed(2)}`).join(' ');
      const oldTag = f.isOld ? `<span class="tag old">Старое заклинание</span>` : '';
      const matTag = f.materialName ? `<span class="tag material">${escapeHtml(f.materialName)}</span>` : '';
      const boxClass = f.isOld ? 'formula-box old-formula' : 'formula-box';
      let editFormulaBtn = ''; if (isEditMode && !p.isVirtual) editFormulaBtn = `<button class="formula-edit-btn" onclick="event.stopPropagation(); editFormula('${c.ID}', ${fIndex})">Править</button>`;
      const calcIdL = `vol_l_${c.ID}_${fIndex}`; const calcIdOz = `vol_oz_${c.ID}_${fIndex}`;
      formulasHtml += `
        <div class="${boxClass}">
          ${editFormulaBtn}
          <div class="formula-title">База ${f.base || '?'} ${oldTag} ${matTag}</div>
          <div class="comps-text" id="text_${c.ID}_${fIndex}">${comps} <span style="font-size:11px;color:var(--muted)">oz</span></div>
          <div class="vol-calc" onclick="event.stopPropagation()">
            <span>на</span><input type="number" id="${calcIdL}" value="1" min="0.01" step="0.1" oninput="syncCalc('${c.ID}', ${fIndex}, this.value, 'L')"><span>л.</span>
            <span style="margin:0 4px;">или</span><input type="number" id="${calcIdOz}" value="33.81" min="0.01" step="0.1" oninput="syncCalc('${c.ID}', ${fIndex}, this.value, 'OZ')"><span>oz.</span>
          </div>
        </div>`;
      if (!f.isOld && !p.isVirtual) {
        const similar = findSimilar(f, f.materialId);
        if (similar.length > 0) {
          const simItems = similar.map(s => `<div class="similar-item" onclick="event.stopPropagation(); openColorModal('${s.color.ID}')"><span>${escapeHtml(s.color.EXTERNAL_NAME)}</span><span class="match-percent">±${s.diff.toFixed(1)}</span></div>`).join('');
          formulasHtml += `<div class="similar-box"><div class="similar-title">✨ Родственные чары (${escapeHtml(f.materialName || 'рецепты')})</div>${simItems}</div>`;
        }
      }
    });
    let ncsBadge = ''; const searchStr = ((c.EXTERNAL_NAME||'') + ' ' + (c.NAME||'')).toUpperCase(); if (searchStr.includes('NCS')) ncsBadge = `<span class="tag ncs">NCS</span>`;
    let renameColorBtn = ''; if (isEditMode && !p.isVirtual) renameColorBtn = `<button class="edit-btn" onclick="event.stopPropagation(); renameColor('${c.ID}')">✏️</button>`;
    const nameData = parseColorName(c);
    let actionsHtml = '';
    if (!p.isVirtual) {
      const archiveBtn = c.isArchived ? `<button class="primary" onclick="event.stopPropagation(); toggleColorArchive('${c.ID}', false)">↩️ Вернуть</button>` : `<button class="warn" onclick="event.stopPropagation(); toggleColorArchive('${c.ID}', true)">🗄 В забвение</button>`;
      const deleteBtn = `<button class="danger" onclick="event.stopPropagation(); deleteSingleColor('${c.ID}')">💀</button>`;
      actionsHtml = `<div class="card-actions">${archiveBtn} ${deleteBtn}</div>`;
    } else { actionsHtml = `<div class="card-actions" style="justify-content:center; font-size:12px; color:var(--muted); margin-top:8px;">(Просмотр)</div>`; }
    el.innerHTML=`
      <div class="card-head"><div class="swatch" style="background:${c.hex}"></div>
        <div class="names"><div class="title">${escapeHtml(nameData.main)} ${renameColorBtn} ${ncsBadge}</div><div class="sub">${escapeHtml(nameData.sub)}</div></div>
      </div>${formulasHtml}${actionsHtml}`;
    list.appendChild(el);
  }
  updateLoadMoreBtn(itemsToShow.length, currentItems.length);
}

function syncCalc(colorId, fIndex, value, sourceUnit) {
  const val = parseFloat(value); if (isNaN(val) || val <= 0) return;
  const inputL = document.getElementById(`vol_l_${colorId}_${fIndex}`); const inputOz = document.getElementById(`vol_oz_${colorId}_${fIndex}`);
  let liters = 0;
  if (sourceUnit === 'L') { liters = val; if (inputOz) inputOz.value = (liters * 33.814).toFixed(2); }
  else { liters = val * 0.0295735; if (inputL) inputL.value = liters.toFixed(2); }
  let targetColor = null;
  for (const p of allPalettes) { const c = p.colors.find(x => String(x.ID) === String(colorId)); if (c) { targetColor = c; break; } }
  if (!targetColor) return;
  const f = targetColor.formulas[fIndex]; if (!f) return;
  const textEl = document.getElementById(`text_${colorId}_${fIndex}`);
  if (textEl) {
    const newComps = f.components.map(x => `<b>${x.pigment}</b>:${(x.amount * liters).toFixed(2)}`).join(' ');
    textEl.innerHTML = newComps + ' <span style="font-size:11px;color:var(--muted)">oz</span>';
  }
}

function openColorModal(colorId) {
  let color = null; let sourcePalette = null;
  for (const p of allPalettes) { const found = p.colors.find(c => String(c.ID) === String(colorId)); if (found) { color = found; sourcePalette = p; break; } }
  if (!color) return;
  const nameData = parseColorName(color);
  let ncsBadge = ''; const searchStr = ((color.EXTERNAL_NAME||'') + ' ' + (color.NAME||'')).toUpperCase(); if (searchStr.includes('NCS')) ncsBadge = `<span class="tag ncs">NCS</span>`;
  let formulasHtml = '';
  color.formulas.forEach(f => {
    const comps = f.components.map(x => `<b>${x.pigment}</b>:${x.amount.toFixed(2)}`).join(' ');
    const oldTag = f.isOld ? `<span class="tag old">Старое заклинание</span>` : '';
    const matTag = f.materialName ? `<span class="tag material">${escapeHtml(f.materialName)}</span>` : '';
    formulasHtml += `<div class="${f.isOld ? 'formula-box old-formula' : 'formula-box'}" style="margin-bottom: 10px;"><div class="formula-title">База ${f.base || '?'} ${oldTag} ${matTag}</div><div>${comps} <span style="color:var(--muted);font-size:11px;">oz (на 1 литр)</span></div></div>`;
  });
  $('modalBody').innerHTML = `
    <div class="card-head" style="margin-bottom: 16px;"><div class="swatch" style="background:${color.hex}; width: 56px; height: 56px;"></div>
      <div class="names"><div class="title" style="font-size: 20px;">${escapeHtml(nameData.main)} ${ncsBadge}</div><div class="sub" style="font-size: 14px;">${escapeHtml(nameData.sub)}</div><div style="font-size: 12px; color: var(--muted); margin-top: 4px;">Раздел: ${escapeHtml(sourcePalette.name)}</div></div>
    </div><div style="border-top: 1px solid var(--border); padding-top: 16px;"><div style="font-family: var(--font-serif); color: var(--accent); font-weight: 700; margin-bottom: 12px; font-size: 16px;">✨ Все базы и рецепты (oz на 1 л)</div>${formulasHtml || '<div style="color: var(--muted); font-style: italic;">Нет формул</div>'}</div>`;
  $('colorModal').classList.add('active');
}

function closeModal(e) { if (e && e.target.id !== 'colorModal') return; $('colorModal').classList.remove('active'); }
function updateLoadMoreBtn(shown, total) { const btn = $('loadMoreBtn'); if (shown < total) { btn.style.display = 'block'; btn.textContent = `📜 Показать еще ${Math.min(PAGE_SIZE, total - shown)} (осталось ${total - shown})`; } else { btn.style.display = 'none'; } }

async function renamePalette(pId) {
  const p = allPalettes.find(x => String(x.id) === String(pId)); if (!p) return;
  const newName = prompt('Новое название раздела:', p.name);
  if (newName && newName.trim() && newName !== p.name) { p.name = newName.trim(); await savePaletteToCloud(p); toast('Название обновлено'); render(); }
}

async function renameColor(colorId) {
  for (const p of allPalettes) {
    if (p.isVirtual) continue;
    const c = p.colors.find(x => String(x.ID) === String(colorId));
    if (c) {
      const currentName = c.EXTERNAL_NAME || c.NAME;
      const newName = prompt('Новое название цвета:', currentName);
      if (newName && newName.trim() && newName !== currentName) { c.EXTERNAL_NAME = newName.trim(); await savePaletteToCloud(p); toast('Название обновлено'); render(); }
      return;
    }
  }
}

async function editFormula(colorId, formulaIndex) {
  for (const p of allPalettes) {
    if (p.isVirtual) continue;
    const c = p.colors.find(x => String(x.ID) === String(colorId));
    if (c && c.formulas[formulaIndex]) {
      const f = c.formulas[formulaIndex];
      const currentStr = f.components.map(x => `${x.pigment}: ${x.amount}`).join(', ');
      const newStr = prompt('Редактирование (формат: ПИГМЕНТ: КОЛИЧЕСТВО, ПИГМЕНТ: КОЛИЧЕСТВО):', currentStr);
      if (newStr && newStr.trim() && newStr !== currentStr) {
        const newComponents = [];
        for (let part of newStr.split(',')) { const [pig, amt] = part.split(':'); if (pig && amt) { const parsedAmt = parseFloat(amt.replace(',', '.').trim()); if (!isNaN(parsedAmt)) newComponents.push({ pigment: pig.trim(), amount: parsedAmt }); } }
        if (newComponents.length > 0) { f.components = newComponents; await savePaletteToCloud(p); toast('Формула обновлена'); render(); }
        else toast('Ошибка формата.', true);
      } return;
    }
  }
}

async function toggleColorArchive(colorId, archiveState) {
  if (archiveState && !confirm('Предать цвет забвению?')) return;
  for (const p of allPalettes) { const color = p.colors.find(c => String(c.ID) === String(colorId)); if (color) { color.isArchived = archiveState; await savePaletteToCloud(p); } }
  toast(archiveState ? 'В забвении' : 'Возвращен'); render();
}

async function deleteSingleColor(colorId) {
  if (!confirm('⚠️ Стереть этот цвет НАВСЕГДА?')) return;
  for (const p of allPalettes) { const idx = p.colors.findIndex(c => String(c.ID) === String(colorId)); if (idx !== -1) { p.colors.splice(idx, 1); await savePaletteToCloud(p); } }
  toast('Цвет стерт'); render();
}

function backToPalettes(){ currentPaletteId=null; $('search').value=''; visibleCount = PAGE_SIZE; render(); }

checkAuth();
</script>

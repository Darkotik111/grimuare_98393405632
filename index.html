<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гримуар повелительниц подземелья</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg-main: #2A1E18;
    --bg-card: #3B2B24;
    --color-ebony: #575A4B;
    --color-taupe: #816C61;
    --color-lilac: #A89B9D;
    --color-lavender: #CFCFEA;
    
    --text-main: #F4F4F4;
    --text-muted: #A89B9D;
    --text-dark: #2A1E18;
    
    --border-color: rgba(255, 255, 255, 0.1);
    --border-focus: #CFCFEA;
    
    --font-sans: 'Inter', -apple-system, sans-serif;
    --font-mono: ui-monospace, 'Courier New', monospace;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    margin: 0; font-family: var(--font-sans); background-color: var(--bg-main); 
    color: var(--text-main); min-height: 100vh; padding: 20px; padding-bottom: 90px; 
    font-size: 15px; line-height: 1.5;
  }
  
  #authScreen { position: fixed; inset: 0; background: var(--bg-main); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-box { background: var(--bg-card); border: 1px solid var(--border-color); padding: 40px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; }
  .auth-box h2 { font-size: 24px; margin-top: 0; margin-bottom: 30px; font-weight: 700; color: var(--color-lavender); }
  .auth-box input { width: 100%; padding: 14px; margin-bottom: 16px; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; font-family: var(--font-sans); font-size: 15px; }
  .auth-box input:focus { outline: none; border-color: var(--border-focus); }
  .auth-box button { width: 100%; padding: 14px; margin-bottom: 12px; font-size: 16px; border-radius: 8px; }
  .auth-error { color: #ff8a8a; font-size: 14px; margin-bottom: 15px; display: none; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 30px; flex-wrap: wrap; }
  h1 { font-size: 24px; margin: 0; font-weight: 600; color: var(--color-lavender); }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
  
  button { 
    background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); 
    padding: 10px 16px; border-radius: 8px; font-size: 14px; font-family: var(--font-sans); 
    cursor: pointer; transition: 0.2s; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
  }
  button:hover { background: #4a382e; border-color: var(--text-muted); }
  button.primary { background: var(--color-lavender); color: var(--text-dark); border-color: var(--color-lavender); font-weight: 600; }
  button.primary:hover { background: #e0e0ff; }
  button.danger { color: #ff8a8a; border-color: rgba(255, 138, 138, 0.3); }
  button.danger:hover { background: rgba(255, 138, 138, 0.1); }
  
  .icon { width: 18px; height: 18px; fill: currentColor; }

  .search-wrapper { position: relative; margin-bottom: 30px; }
  .search-bar { 
    width: 100%; padding: 16px 20px 16px 48px; border-radius: 12px; 
    border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main); 
    font-size: 16px; font-family: var(--font-sans); transition: 0.2s; 
  }
  .search-bar::placeholder { color: var(--text-muted); }
  .search-bar:focus { outline: none; border-color: var(--border-focus); }
  .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; fill: var(--text-muted); }

  .breadcrumbs { font-size: 14px; color: var(--text-muted); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .breadcrumbs a { color: var(--color-lavender); text-decoration: none; cursor: pointer; transition: 0.2s; font-weight: 500; }
  .breadcrumbs a:hover { text-decoration: underline; }

  .grid-palettes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-bottom: 40px; }
  
  .palette-card { 
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
    padding: 20px; cursor: pointer; transition: 0.2s; position: relative;
    display: flex; flex-direction: column; gap: 16px;
  }
  .palette-card:hover { border-color: var(--text-muted); transform: translateY(-2px); }
  
  .palette-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .palette-title { font-weight: 600; font-size: 18px; color: var(--text-main); line-height: 1.3; }
  .palette-meta { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
  
  .palette-preview { display: flex; gap: 4px; height: 40px; border-radius: 8px; overflow: hidden; }
  .palette-preview div { flex: 1; }

  /* СПРАВОЧНИК СООТВЕТСТВИЙ */
  .directory-section { margin-top: 40px; }
  .directory-title { font-size: 20px; font-weight: 600; color: var(--text-main); margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center;}
  
  /* Строчный вид соответствий */
  .match-list { display: flex; flex-direction: column; border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; }
  .match-row { display: flex; border-bottom: 1px solid var(--border-color); background: var(--bg-card); transition: 0.2s; }
  .match-row:last-child { border-bottom: none; }
  .match-row:hover { background: #4a382e; }
  
  .match-code-col { width: 200px; padding: 16px; border-right: 1px solid var(--border-color); font-weight: 600; color: var(--color-lavender); display: flex; align-items: center; justify-content: space-between; }
  .match-colors-col { flex: 1; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  
  .match-color-chip { 
    background: var(--bg-main); border: 1px solid var(--border-color); padding: 6px 12px; 
    border-radius: 20px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px;
    transition: 0.2s;
  }
  .match-color-chip:hover { border-color: var(--color-lavender); color: var(--color-lavender); }
  .match-color-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--border-color); }
  
  .btn-add-manual { background: transparent; border: 1px dashed var(--color-taupe); color: var(--text-muted); padding: 4px 8px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-left: auto; transition: 0.2s; }
  .btn-add-manual:hover { border-color: var(--color-lavender); color: var(--color-lavender); }

  /* СЕТКА ЦВЕТОВ (внутри палитр) */
  .grid-colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

  .color-card { 
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; 
    padding: 20px; display: flex; flex-direction: column; gap: 16px; position: relative; 
    content-visibility: auto; contain-intrinsic-size: 200px;
  }
  .color-card.clickable { cursor: pointer; transition: 0.2s; }
  .color-card.clickable:hover { border-color: var(--text-muted); transform: translateY(-2px); }
  
  .color-header { display: flex; gap: 16px; align-items: center; }
  .color-swatch { 
    width: 56px; height: 56px; border-radius: 12px; 
    flex-shrink: 0; box-shadow: inset 0 2px 5px rgba(0,0,0,0.2); position: relative;
  }
  .color-swatch::after { content: ''; position: absolute; top: 6px; left: 8px; width: 14px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 50%; transform: rotate(-45deg); }
  
  .color-info { flex: 1; min-width: 0; }
  .color-name { font-weight: 600; font-size: 18px; line-height: 1.2; color: var(--text-main); margin-bottom: 4px; }
  .color-code { font-family: var(--font-mono); font-size: 14px; color: var(--text-muted); }

  .formula-block { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; }
  .formula-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .formula-base { font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px; }
  .formula-content { font-family: var(--font-mono); font-size: 14px; line-height: 1.6; color: var(--color-lavender); }
  .formula-content span.unit { color: var(--text-muted); font-size: 12px; }
  
  .calc-row { 
    display: flex; align-items: center; justify-content: space-between; gap: 12px; 
    background: var(--bg-card); padding: 10px 12px; border-radius: 8px; margin-top: 12px; 
    font-size: 13px; color: var(--text-muted); border: 1px solid var(--border-color);
  }
  .calc-inputs { display: flex; align-items: center; gap: 8px; }
  .calc-input { 
    width: 70px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border-color); 
    background: var(--bg-main); color: var(--text-main); font-family: var(--font-mono); text-align: center; font-size: 13px;
  }
  .calc-input:focus { outline: none; border-color: var(--color-lavender); }

  .tag { font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .tag.material { background: rgba(207, 207, 234, 0.1); color: var(--color-lavender); }
  .tag.ncs { background: rgba(168, 155, 157, 0.15); color: #C9BABB; }
  .tag.old { background: rgba(255, 138, 138, 0.1); color: #ff8a8a; }

  .custom-matches-box { background: rgba(168, 155, 157, 0.1); border: 1px dashed var(--color-taupe); padding: 12px; border-radius: 12px; margin-top: 8px; }
  .custom-matches-title { font-size: 12px; color: var(--color-lavender); font-weight: 600; margin-bottom: 8px; }
  .match-item { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--border-color); }
  .match-item:last-child { border-bottom: none; }
  .match-item span { font-weight: 600; color: var(--text-main); }
  .add-match-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); font-size: 12px; padding: 6px 12px; border-radius: 6px; cursor: pointer; transition: 0.2s; margin-top: 8px; }
  .add-match-btn:hover { border-color: var(--color-lavender); color: var(--color-lavender); }

  .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border-color); }
  .card-actions button { flex: 1; padding: 8px; font-size: 13px; justify-content: center; background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
  .card-actions button:hover { background: var(--bg-main); }
  .card-actions button.danger { color: #ff8a8a; }
  .card-actions button.danger:hover { border-color: rgba(255, 138, 138, 0.3); }

  .empty-state { text-align: center; color: var(--text-muted); padding: 60px 20px; font-size: 16px; }
  .empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.3; fill: var(--text-muted); }

  .toast { 
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); 
    background: var(--color-lavender); color: var(--text-dark); 
    padding: 14px 28px; border-radius: 12px; font-weight: 600; font-size: 15px;
    transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 300; box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: #ff8a8a; color: #fff; }

  .modal-overlay { 
    position: fixed; inset: 0; background: rgba(42, 30, 24, 0.85); backdrop-filter: blur(4px); 
    display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; 
  }
  .modal-overlay.active { display: flex; }
  .modal-content { 
    background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; 
    width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; padding: 32px; 
    position: relative; animation: modalIn 0.3s ease-out; color: var(--text-main);
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal-close { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; line-height: 1; transition: 0.2s; padding: 4px; }
  .modal-close:hover { color: var(--text-main); }

  .edit-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; display: inline-flex; align-items: center; border-radius: 4px; transition: 0.2s; }
  .edit-btn:hover { color: var(--text-main); background: var(--bg-main); }
  .formula-edit-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-weight: 500; }
  .formula-edit-btn:hover { border-color: var(--text-main); color: var(--text-main); }

  @media (max-width: 600px) {
    body { padding: 12px; }
    h1 { font-size: 20px; }
    .toolbar { width: 100%; justify-content: space-between; }
    .toolbar button { flex: 1; padding: 10px 4px; font-size: 12px; }
    .grid-colors { grid-template-columns: 1fr; }
    .grid-palettes { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
    .modal-content { padding: 24px; }
    .calc-row { flex-direction: column; align-items: flex-start; }
    
    .match-row { flex-direction: column; }
    .match-code-col { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); }
  }
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-box">
    <h2>Вход в Гримуар</h2>
    <div class="auth-error" id="authError"></div>
    <input type="email" id="authEmail" placeholder="Email">
    <input type="password" id="authPass" placeholder="Пароль">
    <button class="primary" onclick="login()">Открыть книгу</button>
    <button onclick="register()" style="background:transparent; border:none; color:var(--text-muted); font-size:14px; text-decoration:underline; margin-top:8px; width:auto; padding:0;">Регистрация</button>
  </div>
</div>

<div id="appScreen" style="display:none;">
  <header>
    <h1 id="pageTitle">Гримуар</h1>
    <div class="toolbar" id="toolbar">
      <button onclick="document.getElementById('importFiles').click()" class="primary">
        <svg class="icon" viewBox="0 0 24 24"><path d="M12 2L2 12h3v8h6v-6h2v6h6v-8h3L12 2z"/></svg>
        Загрузить
      </button>
      <button onclick="toggleEditMode()" id="editModeBtn">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.996.996 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        Правка
      </button>
      <button onclick="burnBase()" id="burnBtn" class="danger" style="display:none;">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
        Сжечь
      </button>
      <button onclick="toggleArchiveView()" id="archiveBtn">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 6H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2zm0 12H4V8h16v10zM2 4h20v2H2z"/></svg>
        Архив
      </button>
      <button onclick="logout()" class="danger">
        <svg class="icon" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
        Выйти
      </button>
    </div>
  </header>
  <input type="file" id="importFiles" multiple accept=".csv" style="display:none" onchange="handleImport(event)">

  <div class="breadcrumbs" id="crumbs" style="display:none"></div>
  
  <div class="search-wrapper">
    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input class="search-bar" id="search" placeholder="Поиск по названию или коду..." oninput="onSearchInput()">
  </div>

  <div id="list"></div>
  
  <div class="empty-state" id="empty" style="display:none">
    <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2z"/></svg>
    <p>База пуста. Загрузите данные, чтобы начать.</p>
  </div>
  
  <button class="load-more" id="loadMoreBtn" style="display:none" onclick="loadMore()">Показать еще...</button>

  <div class="modal-overlay" id="colorModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ==========================================
// 1. НАСТРОЙКИ SUPABASE
// ==========================================
const SUPABASE_URL = 'https://hdsfocdvtgfzagqvgrtv.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhkc2ZvY2R2dGdmemFncXZncnR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNzE3NDQsImV4cCI6MjEwNzg0Nzc0NH0._DmYReNHr6D-qB1GfjSJ9A55SAtbVyXnOSZim13nWSs';

const { createClient } = supabase;
const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

// ============ УТИЛИТЫ ============
const $=id=>document.getElementById(id);
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg,isErr){ const t=$('toast'); t.textContent=msg; t.className='toast show'+(isErr?' error':'');
  clearTimeout(t._t); t._t=setTimeout(()=>t.className='toast',3000); }

// ============ АВТОРИЗАЦИЯ ============
async function login() {
  const email = $('authEmail').value;
  const pass = $('authPass').value;
  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
  
  if (error) {
    $('authError').textContent = error.message;
    $('authError').style.display = 'block';
  } else { checkAuth(); }
}

async function register() {
  const email = $('authEmail').value;
  const pass = $('authPass').value;
  if (!email || !pass) { alert('Введите email и пароль'); return; }
  const { error } = await supabaseClient.auth.signUp({ email, password: pass });
  if (error) {
    $('authError').textContent = error.message;
    $('authError').style.display = 'block';
  } else { alert('Успешно! Теперь войдите.'); }
}

async function logout() { await supabaseClient.auth.signOut(); location.reload(); }

async function checkAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    $('authScreen').style.display = 'none';
    $('appScreen').style.display = 'block';
    await loadDataFromCloud();
  } else {
    $('authScreen').style.display = 'flex';
    $('appScreen').style.display = 'none';
  }
}

// ============ СИНХРОНИЗАЦИЯ С БАЗОЙ ============
async function loadDataFromCloud() {
  const { data, error } = await supabaseClient.from('palettes').select('data');
  if (error) { toast('Ошибка загрузки: ' + error.message, true); return; }
  
  allPalettes = data.map(row => row.data);
  allPalettes.sort((a,b)=> a.name.localeCompare(b.name));
  
  // Автоматически запускаем поиск соответствий при загрузке (в фоне)
  setTimeout(autoMatchFormulas, 500);
  
  render();
}

async function savePaletteToCloud(palette) {
  const safeId = String(palette.id);
  const payload = { id: safeId, name: palette.name, data: palette };
  const { error } = await supabaseClient.from('palettes').upsert(payload);
  if (error) { toast('Ошибка сохранения: ' + error.message, true); console.error(error); }
}

async function clearCloudBase() {
  const { error } = await supabaseClient.from('palettes').delete().neq('id', 'dummy_value_that_never_exists');
  if (error) { toast('Ошибка очистки: ' + error.message, true); return false; }
  return true;
}

// ============ ЛОГИКА ДАННЫХ ============
function parseColorName(c) {
  let main = c.EXTERNAL_NAME || c.NAME || 'Без названия';
  let sub = c.NAME_RUS || c.NAME || '';
  const hasRussian = /[А-Яа-яЁё]/.test(main);
  if (!hasRussian) {
    const rusAlt = c.NAME_RUS || c.NAME;
    if (rusAlt && /[А-Яа-яЁё]/.test(rusAlt)) { main = rusAlt; sub = c.EXTERNAL_NAME || c.NAME; }
  }
  return { main, sub };
}

function filterAndSort(items, query, getNameFn) {
  if (!query) return items;
  const q = query.toLowerCase();
  if (q.length === 1) return items.filter(item => getNameFn(item).toLowerCase().includes(q));
  const matched = [];
  for (const item of items) {
    const nameStr = getNameFn(item).toLowerCase();
    const index = nameStr.indexOf(q);
    if (index !== -1) { matched.push({ item, priority: index === 0 ? 1 : 2, index }); }
  }
  matched.sort((a, b) => { if (a.priority !== b.priority) return a.priority - b.priority; return a.index - b.index; });
  return matched.map(m => m.item);
}

function shouldFindSimilar(materialName) {
  if (!materialName) return false;
  const m = materialName.toLowerCase();
  return m.includes('декор') || m.includes('высокопроч') || m.includes('интерьер');
}

function parseCSV(text) {
  const result = []; let row = []; let inQuotes = false; let val = '';
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i+1] === '"') { val += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { val += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',' || c === ';') { row.push(val); val = ''; }
      else if (c === '\n' || c === '\r') { 
        if (c === '\r' && text[i+1] === '\n') i++;
        row.push(val); if (row.length > 1 || row[0] !== '') result.push(row); row = []; val = ''; 
      } else { val += c; }
    }
  }
  if (val || row.length) { row.push(val); result.push(row); }
  return result;
}

async function handleImport(e) {
  const files = e.target.files;
  if (!files.length) return;

  let dataColor = [], dataFormula = [], dataFormulaOld = [], dataComponent = [], dataComponentOld = [], dataPalette = [], dataPigment = [], dataMaterial = [];

  for (let file of files) {
    const name = file.name.toLowerCase();
    const text = await file.text();
    const rows = parseCSV(text);
    if (rows.length < 2) continue;
    const headers = rows[0].map(h => h.trim().replace(/^["']|["']$/g, '').toUpperCase());
    const records = rows.slice(1).map(r => {
      let obj = {}; headers.forEach((h, i) => obj[h] = r[i] ? r[i].trim().replace(/^["']|["']$/g, '') : ''); return obj;
    });

    if (name.includes('color') && !name.includes('component')) dataColor = records;
    else if (name.includes('formula_component_old')) dataComponentOld = records;
    else if (name.includes('formula_component')) dataComponent = records;
    else if (name.includes('formula_old')) dataFormulaOld = records;
    else if (name.includes('formula')) dataFormula = records;
    else if (name.includes('palette')) dataPalette = records;
    else if (name.includes('pigment') || name.includes('tint') || name.includes('base')) dataPigment = records;
    else if (name.includes('material')) dataMaterial = records;
  }

  if (!dataColor.length || (!dataFormula.length && !dataFormulaOld.length)) { toast('Нет файлов color или formula', true); return; }
  $('pageTitle').textContent = 'Загрузка...';

  const palettesObj = {};
  dataPalette.forEach(p => { 
    const pId = p.ID_PALETTE || p.ID || p.id_palette || p.id;
    palettesObj[pId] = { id: Number(pId), name: p.NAME_PALETTE || p.NAME || p.name_palette || p.name || 'Без названия', colors: [] }; 
  });
  
  const pigmentsMap = {}; dataPigment.forEach(p => pigmentsMap[p.ID] = p.CODE);
  const materialsMap = {}; dataMaterial.forEach(m => materialsMap[m.ID] = m.SHORT_NAME || m.NAME);
  const colorsMap = {}; dataColor.forEach(c => colorsMap[c.ID] = { ...c, formulas: [], customMatches: [] });

  function buildFormulas(formulasData, componentsData, isOld) {
    const fMap = {};
    formulasData.forEach(f => { fMap[f.ID] = { ...f, components: [], isOld }; });
    componentsData.forEach(comp => {
      if (fMap[comp.FORMULA_ID]) {
        const amt = parseFloat((comp.AM_DEC || comp.AMOUNT || '0').replace(',', '.'));
        if (amt > 0 && comp.PIGMENT_ID && comp.PIGMENT_ID !== 'NULL') {
          fMap[comp.FORMULA_ID].components.push({ pigment: pigmentsMap[comp.PIGMENT_ID] || comp.PIGMENT_ID, amount: amt });
        }
      }
    });
    Object.values(fMap).forEach(f => {
      if (colorsMap[f.COLOR_ID] && f.components.length > 0) {
        colorsMap[f.COLOR_ID].formulas.push({
          components: f.components, base: f.MATERIAL_BASE, name: f.FORMULA_NAME,
          materialId: f.MATERIAL_ID, materialName: materialsMap[f.MATERIAL_ID] || '', isOld: isOld
        });
      }
    });
  }

  if (dataFormula.length > 0) buildFormulas(dataFormula, dataComponent, false);
  if (dataFormulaOld.length > 0) buildFormulas(dataFormulaOld, dataComponentOld, true);

  Object.values(colorsMap).forEach(c => {
    if (c.formulas.length === 0) return;
    const pId = c.PALETTE_ID || c.palette_id || c.ID_PALETTE;
    if (!palettesObj[pId]) palettesObj[pId] = { id: Number(pId), name: 'Раздел ' + pId, colors: [] };
    
    let hex = '#000000';
    if (c.RGB && c.RGB !== 'NULL' && c.RGB !== '0') { const rgbInt = parseInt(c.RGB); if (!isNaN(rgbInt)) hex = '#' + (rgbInt & 0xFFFFFF).toString(16).padStart(6, '0'); }
    c.formulas.sort((a, b) => a.isOld - b.isOld);
    c.isArchived = false;
    palettesObj[pId].colors.push({ ...c, hex });
  });

  await clearCloudBase();
  
  const allToSave = [];
  for (let key in palettesObj) {
    const p = palettesObj[key];
    if (p.colors.length > 0) { p.colors.sort((a,b) => (a.EXTERNAL_NAME||'').localeCompare(b.EXTERNAL_NAME||'')); allToSave.push(p); }
  }

  for (const p of allToSave) await savePaletteToCloud(p);

  toast('Данные обновлены');
  await loadDataFromCloud();
  e.target.value = '';
}

// ============ АВТОМАТИЧЕСКИЙ ПОИСК СООТВЕТСТВИЙ ============
function autoMatchFormulas() {
  // Собираем все цвета
  const allColors = [];
  allPalettes.forEach(p => {
    p.colors.forEach(c => {
      if (!c.isArchived) allColors.push({ ...c, paletteName: p.name });
    });
  });

  // Ищем совпадения
  allColors.forEach(c => {
    if (!c.customMatches) c.customMatches = [];
    
    // 1. Ищем в названии код NCS (например, "NCS 1500N" или "ncs 0500N")
    const searchStr = (c.EXTERNAL_NAME || '') + ' ' + (c.NAME || '') + ' ' + (c.NAME_RUS || '');
    const ncsMatch = searchStr.match(/NCS\s+([A-Z0-9\s\-]+)/i);
    
    if (ncsMatch) {
      const code = ncsMatch[0].trim().toUpperCase();
      // Добавляем, если такого еще нет
      if (!c.customMatches.some(m => m.code === code && m.type === 'auto_name')) {
        c.customMatches.push({ code: code, type: 'auto_name' });
      }
    }

    // 2. Ищем похожие формулы
    const mainFormula = c.formulas.find(f => !f.isOld);
    if (!mainFormula) return;

    allColors.forEach(other => {
      if (c.ID === other.ID) return; // Пропускаем себя
      
      const otherFormula = other.formulas.find(f => !f.isOld);
      if (!otherFormula) return;

      // Сравниваем только если совпадает материал и база
      if (mainFormula.materialId !== otherFormula.materialId) return;
      if (mainFormula.base !== otherFormula.base) return;

      // Считаем разницу
      let diff = 0;
      const compMap = {};
      mainFormula.components.forEach(x => compMap[x.pigment] = x.amount);
      
      otherFormula.components.forEach(x => {
        if (compMap[x.pigment]) {
          diff += Math.abs(compMap[x.pigment] - x.amount);
          delete compMap[x.pigment]; // Убираем, чтобы не считать дважды
        } else {
          diff += x.amount;
        }
      });
      Object.values(compMap).forEach(amt => diff += amt);

      // Если разница меньше 1.0 (очень близкие формулы), добавляем в соответствия
      if (diff < 1.0) {
        if (!c.customMatches.some(m => m.code === other.EXTERNAL_NAME)) {
          c.customMatches.push({ code: other.EXTERNAL_NAME, type: 'auto_formula', diff: diff });
        }
      }
    });
  });

  render(); // Перерисовываем
}

      const archiveBtn = c.isArchived 
        ? `<button class="primary" onclick="event.stopPropagation(); toggleColorArchive('${c.ID}', false)"><svg class="icon" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Вернуть</button>` 
        : `<button class="warn" onclick="event.stopPropagation(); toggleColorArchive('${c.ID}', true)"><svg class="icon" viewBox="0 0 24 24"><path d="M20 6H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2zm0 12H4V8h16v10zM2 4h20v2H2z"/></svg> В архив</button>`;
      const deleteBtn = `<button class="danger" onclick="event.stopPropagation(); deleteSingleColor('${c.ID}')" title="Удалить"><svg class="icon" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>`;
      actionsHtml = `<div class="card-actions">${archiveBtn} ${deleteBtn}</div>`;
    } else { 
      actionsHtml = `<div class="card-actions" style="justify-content:center; font-size:12px; color:var(--text-muted);">Только просмотр</div>`; 
    }

    el.innerHTML=`
      <div class="color-header">
        <div class="color-swatch" style="background:${c.hex}"></div>
        <div class="color-info">
          <div class="color-name">${escapeHtml(nameData.main)} ${ncsBadge} ${renameColorBtn}</div>
          <div class="color-code">${escapeHtml(nameData.sub)}</div>
        </div>
      </div>
      ${customMatchesHtml}
      ${formulasHtml}
      ${addMatchBtn}
      ${actionsHtml}`;
    gridContainer.appendChild(el);
  }
  updateLoadMoreBtn(itemsToShow.length, currentItems.length);
}

function syncCalc(colorId, fIndex, value, sourceUnit) {
  const val = parseFloat(value); if (isNaN(val) || val <= 0) return;
  const inputL = document.getElementById(`vol_l_${colorId}_${fIndex}`); const inputOz = document.getElementById(`vol_oz_${colorId}_${fIndex}`);
  let liters = 0;
  if (sourceUnit === 'L') { liters = val; if (inputOz) inputOz.value = (liters * 33.814).toFixed(2); }
  else { liters = val * 0.0295735; if (inputL) inputL.value = liters.toFixed(2); }
  
  let targetColor = null;
  for (const p of allPalettes) { const c = p.colors.find(x => String(x.ID) === String(colorId)); if (c) { targetColor = c; break; } }
  if (!targetColor) return;
  const f = targetColor.formulas[fIndex]; if (!f) return;
  
  const textEl = document.getElementById(`text_${colorId}_${fIndex}`);
  if (textEl) {
    const newComps = f.components.map(x => {
      const totalMl = x.amount * liters;
      const totalOz = totalMl / 29.5735;
      return `<b>${x.pigment}</b>: ${totalMl.toFixed(4)} <span class="unit">мл</span> <span style="color:var(--text-muted);font-size:11px;">(${totalOz.toFixed(4)} oz)</span>`;
    }).join(' | ');
    textEl.innerHTML = newComps;
  }
}

function openColorModal(colorId) {
  let color = null; let sourcePalette = null;
  for (const p of allPalettes) { const found = p.colors.find(c => String(c.ID) === String(colorId)); if (found) { color = found; sourcePalette = p; break; } }
  if (!color) return;
  
  const nameData = parseColorName(color);
  let ncsBadge = ''; const searchStr = ((color.EXTERNAL_NAME||'') + ' ' + (color.NAME||'')).toUpperCase(); if (searchStr.includes('NCS')) ncsBadge = `<span class="tag ncs">NCS</span>`;
  
  let formulasHtml = '';
  color.formulas.forEach(f => {
    const comps = f.components.map(x => `<b>${x.pigment}</b>: ${x.amount.toFixed(4)}`).join(' | ');
    const oldTag = f.isOld ? `<span class="tag old">Старое</span>` : '';
    const matTag = f.materialName ? `<span class="tag material">${escapeHtml(f.materialName)}</span>` : '';
    formulasHtml += `
      <div class="formula-block" style="margin-bottom: 12px; ${f.isOld ? 'opacity:0.6;' : ''}">
        <div class="formula-header"><span class="formula-base">База ${f.base || '?'} ${oldTag} ${matTag}</span></div>
        <div class="formula-content">${comps} <span class="unit">мл на 1 литр</span></div>
      </div>`;
  });
  
  let matchesHtml = '';
  if (color.customMatches && color.customMatches.length > 0) {
    matchesHtml = `<div class="custom-matches-box" style="margin-bottom:16px;">
      <div class="custom-matches-title">Соответствия:</div>
      ${color.customMatches.map(m => `<div class="match-item"><span>${escapeHtml(m.code)}</span></div>`).join('')}
    </div>`;
  }

  $('modalBody').innerHTML = `
    <div class="color-header" style="margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 20px;">
      <div class="color-swatch" style="background:${color.hex}; width: 72px; height: 72px;"></div>
      <div class="color-info">
        <div class="color-name" style="font-size: 22px;">${escapeHtml(nameData.main)} ${ncsBadge}</div>
        <div class="color-code" style="font-size: 16px;">${escapeHtml(nameData.sub)}</div>
        <div style="font-size: 13px; color: var(--text-muted); margin-top: 8px;">Раздел: <span style="color:var(--color-lavender)">${escapeHtml(sourcePalette.name)}</span></div>
      </div>
    </div>
    ${matchesHtml}
    <div>
      <h3 style="margin-top: 0; margin-bottom: 16px; font-size: 16px; font-weight: 600;">Все рецепты</h3>
      ${formulasHtml || '<div style="color: var(--text-muted); font-style: italic;">Нет формул</div>'}
    </div>`;
  $('colorModal').classList.add('active');
}

function closeModal(e) { if (e && e.target.id !== 'colorModal') return; $('colorModal').classList.remove('active'); }
function updateLoadMoreBtn(shown, total) { const btn = $('loadMoreBtn'); if (shown < total) { btn.style.display = 'block'; btn.textContent = `Показать еще ${Math.min(PAGE_SIZE, total - shown)}...`; } else { btn.style.display = 'none'; } }

// ============ ДЕЙСТВИЯ ============
async function renamePalette(pId) {
  const p = allPalettes.find(x => String(x.id) === String(pId)); if (!p) return;
  const newName = prompt('Новое название палитры:', p.name);
  if (newName && newName.trim() && newName !== p.name) { p.name = newName.trim(); await savePaletteToCloud(p); toast('Сохранено'); render(); }
}

async function renameColor(colorId) {
  for (const p of allPalettes) {
    const c = p.colors.find(x => String(x.ID) === String(colorId));
    if (c) {
      const currentName = c.EXTERNAL_NAME || c.NAME;
      const newName = prompt('Новое название цвета:', currentName);
      if (newName && newName.trim() && newName !== currentName) { c.EXTERNAL_NAME = newName.trim(); await savePaletteToCloud(p); toast('Сохранено'); render(); }
      return;
    }
  }
}

async function editFormula(colorId, formulaIndex) {
  for (const p of allPalettes) {
    const c = p.colors.find(x => String(x.ID) === String(colorId));
    if (c && c.formulas[formulaIndex]) {
      const f = c.formulas[formulaIndex];
      const currentStr = f.components.map(x => `${x.pigment}: ${x.amount}`).join(', ');
      const newStr = prompt('Редактирование (формат: ПИГМЕНТ: МЛ, ПИГМЕНТ: МЛ):', currentStr);
      if (newStr && newStr.trim() && newStr !== currentStr) {
        const newComponents = [];
        for (let part of newStr.split(',')) { const [pig, amt] = part.split(':'); if (pig && amt) { const parsedAmt = parseFloat(amt.replace(',', '.').trim()); if (!isNaN(parsedAmt)) newComponents.push({ pigment: pig.trim(), amount: parsedAmt }); } }
        if (newComponents.length > 0) { f.components = newComponents; await savePaletteToCloud(p); toast('Сохранено'); render(); }
        else toast('Ошибка формата', true);
      } return;
    }
  }
}

async function addCustomMatch(colorId) {
  const code = prompt('Введите код соответствия (например, NCS 1500N):');
  if (!code || !code.trim()) return;
  
  for (const p of allPalettes) {
    const c = p.colors.find(x => String(x.ID) === String(colorId));
    if (c) {
      if (!c.customMatches) c.customMatches = [];
      c.customMatches.push({ code: code.trim().toUpperCase(), type: 'manual' });
      await savePaletteToCloud(p);
      toast('Соответствие добавлено'); render(); return;
    }
  }
}

async function toggleColorArchive(colorId, archiveState) {
  if (archiveState && !confirm('Отправить цвет в архив?')) return;
  for (const p of allPalettes) { const color = p.colors.find(c => String(c.ID) === String(colorId)); if (color) { color.isArchived = archiveState; await savePaletteToCloud(p); } }
  toast(archiveState ? 'В архиве' : 'Возвращен'); render();
}

async function deleteSingleColor(colorId) {
  if (!confirm('Удалить этот цвет?')) return;
  for (const p of allPalettes) { const idx = p.colors.findIndex(c => String(c.ID) === String(colorId)); if (idx !== -1) { p.colors.splice(idx, 1); await savePaletteToCloud(p); } }
  toast('Удалено'); render();
}

function backToPalettes(){ currentPaletteId=null; $('search').value=''; visibleCount = PAGE_SIZE; render(); }

checkAuth();
</script>
